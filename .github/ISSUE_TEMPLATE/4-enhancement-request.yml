name: Enhancement
description: Suggest an improvement to existing functionality
title: "[Enhancement] "
labels:
  - "Type: Enhancement"
  - "Status: Awaiting Review"

body:
  - type: textarea
    id: current
    attributes:
      label: Current behaviour
      description: What existing functionality could be improved?
    validations:
      required: true

  - type: textarea
    id: improvement
    attributes:
      label: Proposed improvement
      description: Describe how you would improve it.
    validations:
      required: true

  - type: textarea
    id: benefit
    attributes:
      label: Benefit
      description: What would this improvement make easier or better?

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add examples, references or other useful information.
