name: Feature Request
description: Suggest a new capability or feature
title: "[Feature] "
labels:
  - "Type: Feature"
  - "Status: Awaiting Review"

body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or need
      description: What problem would this feature solve?
      placeholder: Describe the problem or use case.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed feature
      description: Describe the feature you would like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any existing alternatives or workarounds.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add examples, references or other useful information.
