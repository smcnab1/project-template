name: Bug Report
description: Report something that is not working as expected
title: "[Bug] "
labels:
  - "Type: Bug"
  - "Status: Awaiting Review"

body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug.

        Please do not include secrets, credentials or sensitive data.
        Security vulnerabilities should be reported privately using the repository Security tab.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem clearly and concisely.
      placeholder: Describe what went wrong.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the minimum steps needed to reproduce the issue.
      placeholder: |
        1. Go to...
        2. Select...
        3. See...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Relevant OS, browser, runtime or version information.
      placeholder: "e.g. macOS 26, Chrome 140, Node.js 24"

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add relevant logs, screenshots or other information.
