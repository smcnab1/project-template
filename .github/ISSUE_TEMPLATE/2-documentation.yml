name: Documentation
description: Report missing, unclear or incorrect documentation
title: "[Docs] "
labels:
  - "Type: Documentation"
  - "Status: Awaiting Review"

body:
  - type: textarea
    id: issue
    attributes:
      label: Documentation issue
      description: What is missing, unclear or incorrect?
      placeholder: Describe the documentation problem.
    validations:
      required: true

  - type: input
    id: location
    attributes:
      label: Location
      description: Link to or identify the affected file, page or section.
      placeholder: "e.g. README.md - Installation"

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested change
      description: How could the documentation be improved?

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any other useful information.
