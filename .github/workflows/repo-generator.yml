name: Repo Generator

on:
  workflow_dispatch:
    inputs:
      replace_links_in_markdown:
        description: "Update template repository links"
        type: boolean
        required: false
        default: true

      generate_table_of_contents:
        description: "Update README table of contents"
        type: boolean
        required: false
        default: false

permissions: {}

concurrency:
  group: repo-generator-${{ github.repository }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate repository updates
    runs-on: ubuntu-24.04

    if: ${{ inputs.replace_links_in_markdown || inputs.generate_table_of_contents }}

    permissions:
      contents: write
      pull-requests: write

    env:
      BRANCH_NAME: automation/repo-generator-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Update repository links
        if: ${{ inputs.replace_links_in_markdown }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          placeholder = "smcnab1/project-template-repo"
          replacement = os.environ["GITHUB_REPOSITORY"]

          changed = 0

          for path in Path(".").rglob("*.md"):
              if ".git" in path.parts:
                  continue

              content = path.read_text(encoding="utf-8")
              updated = content.replace(placeholder, replacement)

              if updated != content:
                  path.write_text(updated, encoding="utf-8")
                  print(f"Updated {path}")
                  changed += 1

          print(f"Updated {changed} Markdown file(s)")
          PY

      - name: Setup Node.js
        if: ${{ inputs.generate_table_of_contents }}
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Update README table of contents
        if: ${{ inputs.generate_table_of_contents }}
        run: npx --yes markdown-toc-gen@1.2.0 update README.md

      - name: Check for changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes generated."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat
          fi

      - name: Commit changes
        if: ${{ steps.changes.outputs.changed == 'true' }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH_NAME"
          git add -- '*.md'
          git commit -m "chore: update repository template"
          git push origin "HEAD:$BRANCH_NAME"

      - name: Create pull request
        if: ${{ steps.changes.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$BRANCH_NAME" \
            --title "chore: update repository template" \
            --body "Automated repository-template updates generated by the Repo Generator workflow."
